  <ellipse cx="50" cy="65" rx="7" ry="14" fill="#FF9933" opacity="0.8" transform="rotate(45 50 50)"/>
  <ellipse cx="50" cy="65" rx="7" ry="14" fill="#FFD700" transform="rotate(90 50 50)"/>
  <ellipse cx="50" cy="65" rx="7" ry="14" fill="#FF9933" opacity="0.8" transform="rotate(135 50 50)"/>
  <ellipse cx="50" cy="65" rx="7" ry="14" fill="#FFD700" transform="rotate(180 50 50)"/>
  <ellipse cx="50" cy="65" rx="7" ry="14" fill="#FF9933" opacity="0.8" transform="rotate(225 50 50)"/>
  <ellipse cx="50" cy="65" rx="7" ry="14" fill="#FFD700" transform="rotate(270 50 50)"/>
